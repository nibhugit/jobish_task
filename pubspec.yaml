name: jobish_task
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  connectivity_plus: ^6.1.3
  overlay_support: ^2.1.0
  toastification: ^3.0.2
